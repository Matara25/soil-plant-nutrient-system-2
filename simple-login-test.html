<!DOCTYPE html>
<html>
<head>
    <title>Simple Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #28a745; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
        button:hover { background: #218838; }
        .result { margin: 20px 0; padding: 20px; border-radius: 8px; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .alert { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .debug { background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; margin: 10px 0; white-space: pre-wrap; }
        .go-to-main { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 20px auto; display: block; text-decoration: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Simple Login Test</h1>
        
        <form onsubmit="return testLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" value="farmer" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="farmer123" required>
            </div>
            
            <button type="submit">🚀 Test Login</button>
        </form>
        
        <div id="result"></div>
        <div id="debug"></div>
        
        <a href="http://localhost:8000" class="go-to-main">🏠 Go to Main App</a>
    </div>

    <script>
        function testLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');
            
            // Clear previous results
            resultDiv.innerHTML = '';
            debugDiv.innerHTML = '';
            
            // Show testing
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<h3>🧪 Testing Login...</h3>';
            
            // Test credentials
            console.log('Testing login:', username, password);
            
            // Test 1: Direct credential check
            if (username === 'farmer' && password === 'farmer123') {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = '<h3>✅ Login Credentials Work!</h3><p>Username: farmer<br>Password: farmer123</p>';
                
                // Show what this means
                debugDiv.innerHTML = `
                    <div class="debug">
                        <strong>🎯 Analysis:</strong><br>
                        ✅ Credentials are correct<br>
                        ✅ This should work in main app<br>
                        <br>
                        <strong>🔍 Possible Issues:</strong><br>
                        1. Backend server not running<br>
                        2. JavaScript error on main page<br>
                        3. DOM elements not found<br>
                        <br>
                        <strong>🛠️ Solutions:</strong><br>
                        1. Start backend: python app_advanced.py<br>
                        2. Refresh main page (Ctrl+F5)<br>
                        3. Try different browser<br>
                        <br>
                        <strong>📱 Next Steps:</strong><br>
                        1. Go to main app with these exact credentials<br>
                        2. Look for error messages on page<br>
                        3. Check if page loads completely
                    </div>
                `;
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<h3>❌ Login Failed</h3><p>Check username and password</p>';
                
                debugDiv.innerHTML = `
                    <div class="debug">
                        <strong>❌ Wrong Credentials:</strong><br>
                        Username: "${username}"<br>
                        Password: "${password}"<br>
                        <br>
                        <strong>✅ Correct Credentials:</strong><br>
                        Username: farmer<br>
                        Password: farmer123
                    </div>
                `;
            }
        }
        
        // Auto-test on load
        window.onload = function() {
            console.log('Simple login test loaded');
            document.getElementById('username').focus();
        };
    </script>
</body>
</html>
