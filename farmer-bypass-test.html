<!DOCTYPE html>
<html>
<head>
    <title>Farmer Bypass Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .bypass-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        .bypass-btn:hover { background: #218838; transform: translateY(-2px); }
        .success { 
            background: #d4edda; 
            color: #155724; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }
        .info { 
            background: #d1ecf1; 
            color: #0c5460; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 15px 0;
            border: 1px solid #bee5eb;
        }
        .warning { 
            background: #fff3cd; 
            color: #856404; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 15px 0;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Farmer Bypass Test</h1>
        
        <div class="warning">
            <strong>⚠️ 401 Authentication Issues Detected!</strong><br>
            The backend is rejecting all tokens. This bypass will work regardless of backend issues.
        </div>
        
        <button class="bypass-btn" onclick="testBypassFarmerCreation()">
            🚀 Test Bypass Farmer Creation
        </button>
        
        <button class="bypass-btn" onclick="testMultipleFarmers()" style="background: #007bff;">
            📊 Add Multiple Test Farmers
        </button>
        
        <button class="bypass-btn" onclick="clearAllFarmers()" style="background: #dc3545;">
            🗑️ Clear All Farmers
        </button>
        
        <button class="bypass-btn" onclick="goToMainApp()" style="background: #ffc107;">
            🏠 Go to Main App (Bypass Active)
        </button>
        
        <div id="result"></div>
    </div>

    <script>
        function testBypassFarmerCreation() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">Testing bypass farmer creation...</div>';
            
            // Create test farmer data
            const farmerData = {
                name: 'Test Farmer',
                email: 'test@caiss.com',
                phone_number: '+254712345678',
                location: 'Nairobi, Kenya',
                farm_size: 2.5,
                experience_years: 5
            };
            
            // Create bypass farmer
            const bypassFarmer = {
                id: Date.now(),
                name: farmerData.name,
                email: farmerData.email,
                phone_number: farmerData.phone_number,
                location: farmerData.location,
                farm_size: parseFloat(farmerData.farm_size) || 0,
                experience_years: parseInt(farmerData.experience_years) || 0,
                created_at: new Date().toISOString(),
                created_by: 'Bypass System'
            };
            
            // Get existing farmers from localStorage
            let farmers = JSON.parse(localStorage.getItem('farmers') || '[]');
            
            // Add new farmer
            farmers.push(bypassFarmer);
            
            // Save to localStorage
            localStorage.setItem('farmers', JSON.stringify(farmers));
            
            resultDiv.innerHTML = `
                <div class="success">
                    <h3>✅ Bypass Farmer Created!</h3>
                    <p><strong>Name:</strong> ${bypassFarmer.name}</p>
                    <p><strong>Email:</strong> ${bypassFarmer.email}</p>
                    <p><strong>Location:</strong> ${bypassFarmer.location}</p>
                    <p><strong>Farm Size:</strong> ${bypassFarmer.farm_size} ha</p>
                    <p><strong>Experience:</strong> ${bypassFarmer.experience_years} years</p>
                    <p><strong>ID:</strong> ${bypassFarmer.id}</p>
                    <p><strong>Total Farmers:</strong> ${farmers.length}</p>
                    <p><strong>Method:</strong> Local Storage Bypass</p>
                </div>
            `;
        }
        
        function testMultipleFarmers() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">Adding multiple test farmers...</div>';
            
            // Create multiple test farmers
            const testFarmers = [
                {
                    name: 'John Doe',
                    email: 'john@caiss.com',
                    phone_number: '+254712345678',
                    location: 'Nairobi, Kenya',
                    farm_size: 2.5,
                    experience_years: 5
                },
                {
                    name: 'Mary Smith',
                    email: 'mary@caiss.com',
                    phone_number: '+254723456789',
                    location: 'Mombasa, Kenya',
                    farm_size: 1.8,
                    experience_years: 8
                },
                {
                    name: 'David Kimani',
                    email: 'david@caiss.com',
                    phone_number: '+254734567890',
                    location: 'Kisumu, Kenya',
                    farm_size: 3.2,
                    experience_years: 12
                }
            ];
            
            // Get existing farmers
            let farmers = JSON.parse(localStorage.getItem('farmers') || '[]');
            
            // Add new farmers with bypass data
            const bypassFarmers = testFarmers.map(farmer => ({
                id: Date.now() + Math.random(),
                name: farmer.name,
                email: farmer.email,
                phone_number: farmer.phone_number,
                location: farmer.location,
                farm_size: parseFloat(farmer.farm_size) || 0,
                experience_years: parseInt(farmer.experience_years) || 0,
                created_at: new Date().toISOString(),
                created_by: 'Bypass System'
            }));
            
            // Add to existing farmers
            farmers.push(...bypassFarmers);
            
            // Save to localStorage
            localStorage.setItem('farmers', JSON.stringify(farmers));
            
            resultDiv.innerHTML = `
                <div class="success">
                    <h3>✅ Multiple Farmers Added!</h3>
                    <p><strong>Added:</strong> ${bypassFarmers.length} farmers</p>
                    <p><strong>Total Farmers:</strong> ${farmers.length}</p>
                    <p><strong>Names:</strong> ${bypassFarmers.map(f => f.name).join(', ')}</p>
                    <p><strong>Method:</strong> Local Storage Bypass</p>
                </div>
            `;
        }
        
        function clearAllFarmers() {
            localStorage.removeItem('farmers');
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="info">
                    <h3>🗑️ All Farmers Cleared!</h3>
                    <p>Local storage has been cleared.</p>
                </div>
            `;
        }
        
        function goToMainApp() {
            // Ensure we have some farmers
            const farmers = JSON.parse(localStorage.getItem('farmers') || '[]');
            
            if (farmers.length === 0) {
                testBypassFarmerCreation();
            }
            
            // Redirect to main app
            window.location.href = 'http://localhost:8000';
        }
        
        // Show current status on load
        window.onload = function() {
            const farmers = JSON.parse(localStorage.getItem('farmers') || '[]');
            
            const resultDiv = document.getElementById('result');
            if (farmers.length > 0) {
                resultDiv.innerHTML = `
                    <div class="info">
                        <h3>📊 Current Farmers in Storage</h3>
                        <p><strong>Total:</strong> ${farmers.length} farmers</p>
                        <ul>
                            ${farmers.map(f => `<li><strong>${f.name}</strong> - ${f.location}</li>`).join('')}
                        </ul>
                        <p><strong>Method:</strong> Bypass System Active</p>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
