<!DOCTYPE html>
<html>
<head>
    <title>Farmer Creation Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 5px; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .debug { background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; margin: 10px 0; }
        .quick-test { display: flex; gap: 10px; margin: 20px 0; }
        .quick-btn { flex: 1; padding: 8px; background: #28a745; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Farmer Creation Test</h1>
        
        <div class="quick-test">
            <button class="quick-btn" onclick="testAuth()">Test Auth</button>
            <button class="quick-btn" onclick="testBackend()">Test Backend</button>
            <button class="quick-btn" onclick="createDemoFarmer()">Create Demo Farmer</button>
        </div>
        
        <form id="farmerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" value="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="john@caiss.com" required>
            </div>
            
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" value="+254712345678" required>
            </div>
            
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" value="Nairobi, Kenya" required>
            </div>
            
            <div class="form-group">
                <label for="farm_size">Farm Size (ha)</label>
                <input type="number" id="farm_size" value="2.5" step="0.1" min="0.1">
            </div>
            
            <div class="form-group">
                <label for="experience_years">Experience (years)</label>
                <input type="number" id="experience_years" value="5" min="0" max="50">
            </div>
            
            <button type="button" onclick="createFarmer()">🚀 Create Farmer</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        // Check if we have a token
        let currentToken = localStorage.getItem('authToken');
        let currentUser = localStorage.getItem('currentUser');
        
        async function testAuth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info">Testing authentication...</div>';
            
            if (currentToken && currentUser) {
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Authentication Found!</h3>
                        <p><strong>Token:</strong> ${currentToken.substring(0, 20)}...</p>
                        <p><strong>User:</strong> ${JSON.parse(currentUser).full_name}</p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ No Authentication!</h3>
                        <p>Please login first.</p>
                        <button onclick="window.location.href='quick-login.html'">🔑 Quick Login</button>
                    </div>
                `;
            }
        }
        
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info">Testing backend connection...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/api/farmers', {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <h3>${response.ok ? '✅ Backend Connected!' : '❌ Backend Error!'}</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Message:</strong> ${data.error || 'Connection OK'}</p>
                        <div class="debug">${JSON.stringify(data, null, 2)}</div>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Backend Connection Failed!</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure backend is running on http://localhost:5000</p>
                    </div>
                `;
            }
        }
        
        async function createDemoFarmer() {
            const farmerData = {
                name: 'Demo Farmer',
                email: 'demo@caiss.com',
                phone_number: '+254712345678',
                location: 'Nairobi, Kenya',
                farm_size: 2.5,
                experience_years: 5
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info">Creating demo farmer...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/api/farmers', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(farmerData)
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <h3>${response.ok ? '✅ Farmer Created!' : '❌ Farmer Creation Failed!'}</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Message:</strong> ${data.error || data.message || 'Unknown'}</p>
                        <div class="debug">Request Data: ${JSON.stringify(farmerData, null, 2)}</div>
                        <div class="debug">Response Data: ${JSON.stringify(data, null, 2)}</div>
                    </div>
                `;
                
                if (response.ok) {
                    // Clear form and show success
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('phone_number').value = '';
                    document.getElementById('location').value = '';
                    document.getElementById('farm_size').value = '';
                    document.getElementById('experience_years').value = '';
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Creation Failed!</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function createFarmer() {
            const farmerData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone_number: document.getElementById('phone_number').value,
                location: document.getElementById('location').value,
                farm_size: parseFloat(document.getElementById('farm_size').value),
                experience_years: parseInt(document.getElementById('experience_years').value)
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info">Creating farmer...</div>';
            
            if (!currentToken) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ No Authentication Token!</h3>
                        <p>Please login first.</p>
                        <button onclick="window.location.href='quick-login.html'">🔑 Quick Login</button>
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/farmers', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(farmerData)
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <h3>${response.ok ? '✅ Farmer Created!' : '❌ Farmer Creation Failed!'}</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Message:</strong> ${data.error || data.message || 'Unknown'}</p>
                        <div class="debug">Request Data: ${JSON.stringify(farmerData, null, 2)}</div>
                        <div class="debug">Response Data: ${JSON.stringify(data, null, 2)}</div>
                    </div>
                `;
                
                if (response.ok) {
                    // Clear form
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('phone_number').value = '';
                    document.getElementById('location').value = '';
                    document.getElementById('farm_size').value = '';
                    document.getElementById('experience_years').value = '';
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Creation Failed!</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Show current status on load
        window.onload = function() {
            testAuth();
        };
    </script>
</body>
</html>
